<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vikix Music</title><link rel="stylesheet" href="/view.css">
<main><header><p class="eyebrow">VIKIX / MUSIC</p><h1 id="song">Your next phrase.</h1><p>Change a note. Hear it on the next bar.</p></header>
<section class="transport" aria-label="Playback"><button id="play">Play</button><button id="stop">Stop</button><label>Tempo <input id="tempo" type="number" min="60" max="200" value="120"> BPM</label><label>Gain <input id="gain" type="range" min="0" max="0.1" step="0.005" value="0.08"></label><span id="playing">Stopped</span></section>
<section><div class="heading"><label>Pattern <select id="pattern"></select></label><label>Paint note <select id="note"></select></label></div><div id="grid" role="group" aria-label="Pattern steps"></div><p class="hint">Click a step to paint the selected note. Click it again for a rest.</p></section>
<p id="status" role="status">Connecting…</p><footer>Your pattern file is the score. Edits take a snapshot. Closing this view leaves the music running.</footer></main><script src="/view.js"></script></html>
