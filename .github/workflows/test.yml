# Tests for Vikix. Each step runs a script from tests/, so everything here
# can also be run on your own machine: tests/run.sh (or tests/run.sh --all).
# tests/ci.sh wraps each one so a failure's last lines show up as a public
# annotation (job logs need a GitHub login; annotations don't).
# Every test step runs even after one failed (if: !cancelled()), so one red
# step doesn't hide the rest; a job is still red when any step is.
#
#   lint     every script parses, is executable where it should be, and
#            passes shellcheck; every Lisp file reads; the battery warner
#            warns when it should; stages are safe to re-run and undo
#            works; images open with their folder; vikix update
#            restarts into a new version
#   void     inside Void's own container: every package name exists, and
#            both install parts run through with --dry-run
#   editors  the Emacs and Neovim configs install from scratch and start
#            without errors
#   office   the office and the tests around it that need no screen (the
#            tasks, the handoff, the house rules, the tester, the scheduler,
#            the release, the slots, the plans, the door, the stand-in
#            agents): python3, git and flock, which the runner has, and
#            sbcl for the door. The screen tests, a StumpWM on Xvfb, stay
#            on the laptop (tests/run.sh); lint holds every step here to a
#            test that is in tests/ and in tests/run.sh's list
#
# Weekly as well as on every push: the editor configs pull packages from
# MELPA, GitHub and the Treesitter grammars, which can break with no change
# here (SLIME's xterm-color contrib and nvim-treesitter's archived branch
# both did).

name: test

on:
  push:
    branches: ['**']     # not a tag: a release's tag would run the whole workflow again on the same commit
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"     # Mondays, 04:17 UTC

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint
        if: ${{ !cancelled() }}
        run: tests/ci.sh lint
      - name: sbcl, to read the Lisp files, restic for the backup test, texinfo and install-info for the info test, mandoc (Void's man) for the man test
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends sbcl restic texinfo install-info mandoc
      - name: lisp
        if: ${{ !cancelled() }}
        run: tests/ci.sh lisp
      - name: battery
        if: ${{ !cancelled() }}
        run: tests/ci.sh battery
      - name: home
        if: ${{ !cancelled() }}
        run: tests/ci.sh home
      - name: services
        if: ${{ !cancelled() }}
        run: tests/ci.sh services
      - name: backup
        if: ${{ !cancelled() }}
        run: tests/ci.sh backup
      - name: image
        if: ${{ !cancelled() }}
        run: tests/ci.sh image
      - name: theme
        if: ${{ !cancelled() }}
        run: tests/ci.sh theme
      - name: theme-import
        if: ${{ !cancelled() }}
        run: tests/ci.sh theme-import
      - name: bar
        if: ${{ !cancelled() }}
        run: tests/ci.sh bar
      - name: examples
        if: ${{ !cancelled() }}
        run: tests/ci.sh examples
      - name: uv, which the AI examples run with (pipx is on the runner)
        run: command -v uv || pipx install uv
      - name: dev-ai
        if: ${{ !cancelled() }}
        run: tests/ci.sh dev-ai
      - name: notes
        if: ${{ !cancelled() }}
        run: tests/ci.sh notes
      - name: project
        if: ${{ !cancelled() }}
        run: tests/ci.sh project
      - name: drives
        if: ${{ !cancelled() }}
        run: tests/ci.sh drives
      - name: firmware
        if: ${{ !cancelled() }}
        run: tests/ci.sh firmware
      - name: fingerprint
        if: ${{ !cancelled() }}
        run: tests/ci.sh fingerprint
      - name: rofi
        if: ${{ !cancelled() }}
        run: tests/ci.sh rofi
      - name: wallpaper
        if: ${{ !cancelled() }}
        run: tests/ci.sh wallpaper
      - name: updates
        if: ${{ !cancelled() }}
        run: tests/ci.sh updates
      - name: notifications
        if: ${{ !cancelled() }}
        run: tests/ci.sh notifications
      - name: idle
        if: ${{ !cancelled() }}
        run: tests/ci.sh idle
      - name: capture
        if: ${{ !cancelled() }}
        run: tests/ci.sh capture
      - name: nightlight
        if: ${{ !cancelled() }}
        run: tests/ci.sh nightlight
      - name: update
        if: ${{ !cancelled() }}
        run: tests/ci.sh update
      - name: windows
        if: ${{ !cancelled() }}
        run: tests/ci.sh windows
      - name: ai
        if: ${{ !cancelled() }}
        run: tests/ci.sh ai
      - name: ai-local
        if: ${{ !cancelled() }}
        run: tests/ci.sh ai-local
      - name: llm
        if: ${{ !cancelled() }}
        run: tests/ci.sh llm
      - name: ai-keys
        if: ${{ !cancelled() }}
        run: tests/ci.sh ai-keys
      - name: agents
        if: ${{ !cancelled() }}
        run: tests/ci.sh agents
      - name: debug
        if: ${{ !cancelled() }}
        run: tests/ci.sh debug
      - name: dictate
        if: ${{ !cancelled() }}
        run: tests/ci.sh dictate
      - name: mcp
        if: ${{ !cancelled() }}
        run: tests/ci.sh mcp
      - name: swank
        if: ${{ !cancelled() }}
        run: tests/ci.sh swank
      - name: webapp
        if: ${{ !cancelled() }}
        run: tests/ci.sh webapp
      - name: features
        if: ${{ !cancelled() }}
        run: tests/ci.sh features
      - name: welcome
        if: ${{ !cancelled() }}
        run: tests/ci.sh welcome
      - name: menu
        if: ${{ !cancelled() }}
        run: tests/ci.sh menu
      - name: pkg
        if: ${{ !cancelled() }}
        run: tests/ci.sh pkg
      - name: oneline
        if: ${{ !cancelled() }}
        run: tests/ci.sh oneline
      - name: info
        if: ${{ !cancelled() }}
        run: tests/ci.sh info
      - name: man
        if: ${{ !cancelled() }}
        run: tests/ci.sh man
      - name: changed-map
        if: ${{ !cancelled() }}
        run: tests/ci.sh changed-map

  void:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      # A fresh Void refuses other installs until xbps itself is current.
      - name: Update Void, add git and sudo
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y bash git sudo curl
          # Some lists name nonfree and multilib packages (intel-ucode, nmap,
          # dropbox, steam and its -32bit libraries): check them against those
          # repositories too.
          xbps-install -y void-repo-nonfree void-repo-multilib void-repo-multilib-nonfree
          xbps-install -S
      - uses: actions/checkout@v5
      # The installer refuses to run as root, so the tests run as a normal
      # user with sudo, as on a real machine.
      - name: A normal user
        run: |
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester
          chown -R tester: "$GITHUB_WORKSPACE"
      - name: packages
        if: ${{ !cancelled() }}
        run: su tester -c "cd '$GITHUB_WORKSPACE' && GITHUB_ACTIONS=true tests/ci.sh packages"
      - name: dry-run
        if: ${{ !cancelled() }}
        run: su tester -c "cd '$GITHUB_WORKSPACE' && GITHUB_ACTIONS=true tests/ci.sh dry-run"

  editors:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc-full:latest
    timeout-minutes: 45
    steps:
      - name: Update Void, add git and sudo
        shell: sh
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y bash git sudo curl
      - uses: actions/checkout@v5
      # What Vikix installs for the editors, plus a compiler for the
      # Treesitter parsers and the Emacs packages that build code.
      # lib/common.sh is bash; the container's default shell is sh. The
      # editors' packages are the emacs, neovim and editor-tools lists
      # (editors.list was split in 0.46.0).
      - name: The editors, as Vikix installs them
        shell: bash
        run: |
          . lib/common.sh
          xbps-install -y base-devel $(read_list packages/emacs.list) $(read_list packages/neovim.list) $(read_list packages/editor-tools.list)
      - name: A normal user
        run: |
          useradd -m tester
          chown -R tester: "$GITHUB_WORKSPACE"
      - name: editors
        if: ${{ !cancelled() }}
        run: su tester -c "cd '$GITHUB_WORKSPACE' && GITHUB_ACTIONS=true tests/ci.sh editors"

  office:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: sbcl, for the door's reading of an agent's forms
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends sbcl
      - name: tasks
        if: ${{ !cancelled() }}
        run: tests/ci.sh tasks
      - name: handoff
        if: ${{ !cancelled() }}
        run: tests/ci.sh handoff
      - name: house
        if: ${{ !cancelled() }}
        run: tests/ci.sh house
      - name: tester
        if: ${{ !cancelled() }}
        run: tests/ci.sh tester
      - name: scheduler
        if: ${{ !cancelled() }}
        run: tests/ci.sh scheduler
      - name: release
        if: ${{ !cancelled() }}
        run: tests/ci.sh release
      - name: queue
        if: ${{ !cancelled() }}
        run: tests/ci.sh queue
      - name: plan
        if: ${{ !cancelled() }}
        run: tests/ci.sh plan
      - name: door
        if: ${{ !cancelled() }}
        run: tests/ci.sh door
      - name: grok
        if: ${{ !cancelled() }}
        run: tests/ci.sh grok
      - name: codex
        if: ${{ !cancelled() }}
        run: tests/ci.sh codex
      - name: reconnect
        if: ${{ !cancelled() }}
        run: tests/ci.sh reconnect
      - name: try
        if: ${{ !cancelled() }}
        run: tests/ci.sh try
      - name: vk
        if: ${{ !cancelled() }}
        run: tests/ci.sh vk
      - name: records
        if: ${{ !cancelled() }}
        run: tests/ci.sh records

  # The good tag: the last commit of main whose four jobs all passed here.
  # A machine on the good channel (~/.config/vikix/channel, the default)
  # updates to it and never to an untested commit; one on main takes every
  # commit as it lands (plans/DESIGN-dependable.md item 1). The tag is
  # pushed with the workflow's own token, which starts no second run.
  good:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, void, editors, office]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: move the good tag to this commit
        run: |
          git tag -f good "$GITHUB_SHA"
          git push -f origin refs/tags/good
