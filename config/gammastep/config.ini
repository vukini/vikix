; gammastep — the night light. Vikix copied this file once; it is yours.
; Changes take effect when the night light starts again: Super+Alt+l twice,
; or the next login.

[general]
; The colour temperature of the screen, in kelvin: 6500 is neutral,
; lower is warmer (redder). 3500 is strong, 4500 gentle.
temp-day=6500
temp-night=4000

; When to change, by the clock. Over these hours the screen slowly warms
; (dusk) and cools again (dawn). By the clock, not the sun, so it needs no
; location; move the times with the seasons if you like.
dusk-time=19:00-20:00
dawn-time=6:00-7:00

; Change gently when it starts and stops, not all at once.
fade=1

; Through X's randr, which every graphics driver supports.
adjustment-method=randr
