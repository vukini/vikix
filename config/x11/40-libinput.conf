# /etc/X11/xorg.conf.d/40-libinput.conf — installed by Vikix (install/55-hardware.sh).
# Touchpad the way a laptop user expects: tap to click, two-finger scroll
# that follows the fingers, and the pad ignored while typing.
Section "InputClass"
    Identifier "Vikix touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    Option "DisableWhileTyping" "true"
    Option "ClickMethod" "clickfinger"
EndSection
