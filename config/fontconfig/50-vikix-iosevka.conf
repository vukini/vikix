<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Vikix: alacritty, rofi and dunst ask for "Iosevka", which only arrives
     in part two of the install. Until then fontconfig would hand them a
     proportional font; this makes "Iosevka" fall back to monospace. -->
<fontconfig>
  <alias>
    <family>Iosevka</family>
    <default><family>monospace</family></default>
  </alias>
</fontconfig>
