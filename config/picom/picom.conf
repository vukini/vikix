# ~/.config/picom/picom.conf — yours; Vikix copied it once.
# The compositor stops tearing, and lets the windows you aren't using
# recede: they turn a little see-through, with what's behind them blurred.
#
# In a virtual machine vikix-session starts picom with --backend xrender:
# glx there is drawn in software and misses redraws.
#
# picom reads this file again when it changes. To change the backend,
# restart it instead (pkill picom; picom -b): switching glx to xrender
# while it runs has frozen a desktop.
backend = "glx";
vsync = true;
unredir-if-possible = true;   # full-screen video and games skip the compositor

# The focused window is solid; the others let the wallpaper through.
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'i3lock'",   # the lock screen hides the desktop, whatever the setting above
  "100:class_g = 'Rofi'",     # the launcher and notifications never have focus,
  "100:class_g = 'Dunst'",    # but are there to be read
  "100:class_g = 'slop'"      # the screenshot area picker
];

blur: {
  method = "dual_kawase";
  strength = 4;
};
blur-background-exclude = [
  "class_g = 'slop'",
  "class_g = 'maim'"
];

# Square corners and no shadows: StumpWM, rofi and dunst draw 2 px frames.
corner-radius = 0;
shadow = false;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-exclude = [
  "class_g = 'i3lock'"        # the lock screen appears at once, never half faded in
];
