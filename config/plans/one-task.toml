# one-task — one worker on one task at one desk, released when it is in
#
# A plan of Vikix's: vikix agents plan new one-task NAME writes a copy of it
# with your project filled in, for you to edit; the Office's New plan… does
# the same. Every line beginning EDIT: is yours to write before the plan
# runs (plan run refuses a task still holding one). vikix agents help plan
# says what each key does; the guide's "A plan" has the whole of it.

project = "PROJECT"
at-once = 1
gate = "none"          # "me": the desk's release waits for your yes

[[task]]
name = "work"
desk = "topic"         # plan new puts the plan's name here: the worktree's ending and the branch
task = "EDIT: what the worker builds, in your words: where it goes, what it must keep working, how you will know it is done"
release = "EDIT: the release's line, what it brings"
# agent = "codex"      # the worker's choices, as the New worker form has them
# local = true
# push = false
# no-tests = false
# mode = "supervised"
