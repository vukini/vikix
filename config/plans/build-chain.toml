# build-chain — build it, then its tests, then its guide: three workers in turn at one desk, released once at the end
#
# A plan of Vikix's: vikix agents plan new build-chain NAME writes a copy of
# it with your project filled in, for you to edit; the Office's New plan…
# has its tasks as a form's fields and writes your words in. Every line
# beginning EDIT: is yours to write before the plan runs (plan run refuses
# a task still holding one); the example after "E.g." in each shows the
# shape. Tasks at one desk are a chain: the next worker starts once the
# last has handed in and its tests pass, and reads the handoff it left; the
# desk is released once, at the chain's end, so only the last task has a
# release line: what the release's commit and tag say after the version
# (Vikix 0.72.44: that line). vikix agents help plan says what each key
# does.

project = "PROJECT"
at-once = 1
gate = "me"            # the desk's release waits for your yes; "none": it goes

[[task]]
name = "build"
desk = "topic"         # plan new puts the plan's name here: the worktree's ending and the branch
task = "EDIT: what to build, in your words: where it goes, what it must keep working, how you will know it is done. Commit as you go; hand in with status review. E.g. A Super+m entry that moves every window of the workspace in front to another, asked for in the menu, in registry.lisp and windows.lisp; floating windows keep floating; done when the entry is in the menu and the windows move."

[[task]]
name = "tests"
desk = "topic"
after = ["build"]
task = "EDIT: the tests for what the worker before you built (read its handoff first): what a user would do with it, what must not break, each in the project's test runner. Hand in with status review. E.g. In tests/gather.sh, on the hidden StumpWM: two windows moved, a floating one still floating after, the entry refused with one workspace."

[[task]]
name = "guide"
desk = "topic"
after = ["tests"]
task = "EDIT: the guide for what the two workers before you built (read their handoffs): the user's words, where it sits in the existing pages, every real path, key and command named. Hand in with status finished. E.g. A paragraph in docs/customize.md under Workspaces, naming the menu entry and what stays floating; a line in README.md's keys table if a key was given."
release = "EDIT: one line, what the whole chain brings. E.g. Super+m moves a whole workspace's windows to another"
