# one-desk — one desk, workers in turn: build it, then its tests and guide, released once at the end
#
# A plan of Vikix's: vikix agents plan new one-desk NAME writes a copy of it
# with your project filled in, for you to edit; the Office's New plan… has
# its tasks as a form's fields and writes your words in. Every line
# beginning EDIT: is yours to write before the plan runs (plan run refuses
# a task still holding one). Tasks at one desk are a chain: the next
# worker starts once the last has handed in and its tests pass, and reads
# the handoff it left; the desk is released once, at the chain's end.
# vikix agents help plan says what each key does.

project = "PROJECT"
at-once = 1
gate = "me"            # the desk's release waits for your yes; "none": it goes

[[task]]
name = "build"
desk = "topic"         # plan new puts the plan's name here: the worktree's ending and the branch
task = "EDIT: what to build, in your words: where it goes, what it must keep working, how you will know it is done. Commit as you go; hand in with status review."

[[task]]
name = "tests"
desk = "topic"
after = ["build"]
task = "EDIT: the tests for what the worker before you built (read its handoff first): what a user would do with it, what must not break, each in the project's test runner. Hand in with status review."

[[task]]
name = "guide"
desk = "topic"
after = ["tests"]
task = "EDIT: the guide for what the two workers before you built (read their handoffs): the user's words, where it sits in the existing pages, every real path, key and command named. Hand in with status finished."
release = "EDIT: the release's line, what it brings"
