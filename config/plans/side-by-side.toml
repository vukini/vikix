# side-by-side — two desks at once, and a task after both at a fresh desk
#
# A plan of Vikix's: vikix agents plan new side-by-side NAME writes a copy
# of it with your project filled in, for you to edit; the Office's New plan…
# does the same. Every line beginning EDIT: is yours to write before the
# plan runs (plan run refuses a task still holding one). Tasks at different
# desks run side by side, up to at-once; a task after a task at another
# desk waits for that desk's release and starts at a fresh desk, made from
# main as it then is. Turns and the clash rules keep two desks off one
# file. vikix agents help plan says what each key does.

project = "PROJECT"
at-once = 2
gate = "me"            # a desk's release waits for your yes; "none": it goes

[[task]]
name = "first"
desk = "topic-one"     # plan new puts the plan's name for topic: each desk the worktree's ending and the branch
task = "EDIT: the first part, in your words: where it goes, what it must keep working, how you will know it is done. Hand in with status review."
release = "EDIT: the first part's release line"

[[task]]
name = "second"
desk = "topic-two"
task = "EDIT: the second part, apart from the first: its own files where you can. Hand in with status review."
release = "EDIT: the second part's release line"

[[task]]
name = "together"
desk = "topic-together"
after = ["first", "second"]
task = "EDIT: what joins the two parts, once both are released: read both desks' handoffs in the Office's archive first. Hand in with status finished."
release = "EDIT: the release's line, what the whole brings"
