# two-desks — two desks at once, each its own part, then a task joining them at a fresh desk
#
# A plan of Vikix's: vikix agents plan new two-desks NAME writes a copy of
# it with your project filled in, for you to edit; the Office's New plan…
# has its tasks as a form's fields and writes your words in. Every line
# beginning EDIT: is yours to write before the plan runs (plan run refuses
# a task still holding one); the example after "E.g." in each shows the
# shape. Tasks at different desks run side by side, up to at-once; a task
# after a task at another desk waits for that desk's release and starts at
# a fresh desk, made from main as it then is. Turns and the clash rules
# keep two desks off one file. Each desk's release line is what the
# release's commit and tag say after the version (Vikix 0.72.44: that
# line): one line, what it brings. vikix agents help plan says what each
# key does.

project = "PROJECT"
at-once = 2
gate = "me"            # a desk's release waits for your yes; "none": it goes

[[task]]
name = "first"
desk = "topic-one"     # plan new puts the plan's name for topic: each desk the worktree's ending and the branch
task = "EDIT: the first part, in your words: where it goes, what it must keep working, how you will know it is done. Hand in with status review. E.g. The record store takes a 'seen' mark per record, in bin/vikix-records and its table; vikix records add keeps working; done when tests/records.sh marks one and finds it."
release = "EDIT: one line, what the first part brings. E.g. Records can be marked seen"

[[task]]
name = "second"
desk = "topic-two"
task = "EDIT: the second part, apart from the first: its own files where you can. Hand in with status review. E.g. The inbox plugin lists a record's age in its rows, in the plugins repo's inbox/bin/inbox; done when the plugins' tests/check.sh passes."
release = "EDIT: one line, what the second part brings. E.g. The inbox shows each record's age"

[[task]]
name = "together"
desk = "topic-together"
after = ["first", "second"]
task = "EDIT: what joins the two parts, once both are released: read both desks' handoffs in the Office's archive first. Hand in with status finished. E.g. The inbox hides records marked seen unless asked for them; done when a marked record leaves the list and comes back with --all."
release = "EDIT: one line, what the whole brings. E.g. The inbox hides what you have seen"
