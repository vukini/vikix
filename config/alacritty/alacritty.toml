# ~/.config/alacritty/alacritty.toml — yours; Vikix copied it once and won't touch it again.
# Colours come from Vikix's theme (vikix theme NAME, or Super+m, Theme),
# through the import below. Your own [colors] here would win over it.

[general]
import = ["~/.config/vikix/theme/alacritty.toml"]

[font]
normal = { family = "Iosevka" }
size = 11.5

[window]
padding = { x = 8, y = 6 }
