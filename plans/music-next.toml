# music-next — remaining Music work, executed through Office
# Prepared 2026-10-17; start only after the music-phase0 release.
# Each next desk starts from released main; final planning shares the performance desk.
# The existing design is context; each task states its narrower scope.
# 2026-10-17: no user gate and no questions before implementation; a plan runs on its own.
# Workers decide, record each decision in the handoff, and ask only when a choice would
# change released behaviour.
project = "vikix"
at-once = 1
gate = "none"

[[task]]
name = "banks"
desk = "music-banks"
agent = "codex"
mode = "autonomous"
push = false
no-tests = false
task = """
Before implementation, confirm main contains the released Music browser pads and
playhead; otherwise hand back waiting for that release.
Read the desk handoff, project instructions and plans/DESIGN-music.md first. Preserve
the released browser interface, separate SBCL clock, authenticated loopback control and
data-only reader. Inspect the current implementation before estimating. Implement only
this task; decide unresolved product choices yourself, record each in the handoff, and
ask through Office only when a choice would change released behaviour. Update affected
guides and generated command documentation in the same commit. Run tests/run.sh
--changed, plus the relevant isolated public-launcher checks; report real desktop
listening separately. Commit only your changed files by name. Hand in as review with
decisions, defects, checks and short manual test instructions.
The plan releases the desk once its tests pass; do not push. Implement persistent named pad
assignments using the proposed bank form, preserving existing scores without a bank.
Resolve malformed, missing and duplicate references explicitly; the browser must edit
assignments using the existing snapshot/revision path and show which pattern is playing.
Keep one playing pattern at a time. No global keyboard bindings in this task.
"""
acceptance = [
  "Old scores still play and show their named patterns.",
  "Saved bank assignments survive restart and undo; stale edits are refused.",
  "Isolated browser tests cover assignment, reload, malformed references and switching while playing.",
]
release = "Saved Music pad banks"

